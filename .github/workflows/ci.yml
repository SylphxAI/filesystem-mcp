name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core and MCP server
        run: bun run build:rust

      - name: Rust policy core tests
        run: cargo test

      - name: Lint and typecheck
        run: bun run validate

      - name: Rust policy boundary
        run: bun run test:rust-policy

      - name: Rust walk boundary
        run: bun run test:rust-walk

      - name: Release gate
        run: bun run benchmark:release-gate

      - name: Throughput benchmarks
        run: bun run benchmark

      - name: Docs build
        run: bun run docs:build
