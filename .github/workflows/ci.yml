name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust policy core tests
        run: cargo test

      - name: Lint and typecheck
        run: bun run validate

      - name: Rust policy boundary
        run: bun run test:rust-policy

      - name: Release gate
        run: bun run benchmark:release-gate

      - name: Public surface audit (README discovery)
        run: bunx vitest run test/readmeDiscovery.test.ts

      - name: Throughput benchmarks
        run: bun run benchmark

      - name: Docs build
        run: bun run docs:build