[package]
name = "filesystem-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Root-scoped path policy engine for filesystem-mcp"

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20.0"