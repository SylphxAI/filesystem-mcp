[package]
name = "filesystem-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON stdin/stdout bridge for filesystem-mcp Rust policy core"

[[bin]]
name = "filesystem-cli"
path = "src/main.rs"

[dependencies]
filesystem-core = { path = "../filesystem-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"